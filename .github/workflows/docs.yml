name: Docs & Changelog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  validate-agents-md:
    name: Validate AGENTS.md commands
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - run: bash build-aux/validate-agents-md.sh

  check-changelog:
    name: Regenerate CHANGELOG
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: (re)generate CHANGELOG.md
        run: |
          bash build-aux/generate-changelog.sh --write
          if git diff --exit-code CHANGELOG.md >/dev/null 2>&1; then
            echo "CHANGELOG.md is current"
            exit 0
          fi
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add CHANGELOG.md
          git commit -m "chore: regenerate CHANGELOG.md [skip ci]"
          git push

  cargo-doc:
    name: Build cargo doc + upload artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - name: Build docs
        run: cargo doc --no-deps
      - name: Upload doc artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdoc
          path: target/doc
